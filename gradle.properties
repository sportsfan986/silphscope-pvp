# Project-wide Gradle settings (sized to fit inside 7 GB GitHub Actions ubuntu-latest RAM without swap).
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
kotlin.incremental=true

# AndroidX package structure required by Android Gradle Plugin
android.useAndroidX=true

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35
