                const startBattleBtn = document.getElementById("btn-start-battle");
                if (isReplay) {
                    if (swordMinBtn) swordMinBtn.classList.add("hidden");
                    if (startBattleBtn) startBattleBtn.classList.add("hidden");
                } else {
                    if (swordMinBtn) swordMinBtn.classList.remove("hidden");
                    if (startBattleBtn) startBattleBtn.classList.remove("hidden");
                }

                // Render active team chips for player switches as 2-row buttons: 3-letter code on top row, HP% on bottom row (when HP tracking enabled)
                const teamChipsContainer = document.getElementById("sky-team-chips");
                const hpTrackingOnForChips = !!battleData.enableHpTracking;
                if (teamChipsContainer && battleData.team) {
                    const pSlotHpArr = Array.isArray(battleData.playerSlotHpPct) ? battleData.playerSlotHpPct : [100, 100, 100];
                    teamChipsContainer.innerHTML = battleData.team.map((member, mIdx) => {
                        const fullName = member.name || "Pokemon";
                        const rawCode = String(member.code || "").replace(/^S(?=[A-Z]{3})/i, "").trim();
                        const poke3 = (rawCode.length === 3 ? rawCode.toUpperCase() : abbrPoke3Only(fullName));
                        const isActive = (fullName.toLowerCase() === (battleData.userActivePokemon || "").toLowerCase());
                        const rawHp = typeof member.hpPct === "number" ? member.hpPct : (typeof pSlotHpArr[mIdx] === "number" ? pSlotHpArr[mIdx] : 100);
                        const isFainted = (rawHp <= 0) || (!isActive && !!(battleData.playerFaintedSlots && battleData.playerFaintedSlots[mIdx]));
                        const slotHp = isFainted ? 0 : Math.max(0, Math.min(100, Math.round(rawHp)));
                        const hpColor = isFainted ? "#64748b" : (slotHp > 50 ? "#4ade80" : (slotHp > 20 ? "#fbbf24" : "#f87171"));
                        const faintStyle = isFainted ? 'opacity:0.45; text-decoration:line-through;' : '';
                        const subText = hpTrackingOnForChips ? `${slotHp}%` : (isFainted ? "0%" : (isActive ? "ACT" : "RDY"));
                        const subColor = hpTrackingOnForChips || isFainted ? hpColor : (isActive ? "#67e8f9" : "#94a3b8");
                        return `<button class="chip-btn ${isActive && !isFainted ? 'active' : ''} ${isFainted ? 'col-fainted' : ''}" style="${faintStyle}" onclick="selectUserPokemonByIndex(${mIdx})" title="Active lead: ${fullName}${isFainted ? ' (Fainted 0% HP)' : (hpTrackingOnForChips ? ' (' + slotHp + '% HP)' : '')}"><span class="btn-row-top">${poke3}:</span><span class="btn-row-sub" style="color:${subColor};">${subText}</span></button>`;
                    }).join("");
                }
            } catch (e) {
                console.error("Toolbar render error", e);
            }

            updateShieldButtonsUi();
            refreshSwapClocks();

            const oppNameEl = document.getElementById("sky-opp-name");
            const oppMoveEl = document.getElementById("sky-opp-fastmove");
            const myShortEl = document.getElementById("sky-my-short");
            const oppCmpBadgeEl = document.getElementById("sky-opp-cmp-badge");
            const myCmpBadgeEl = document.getElementById("sky-my-cmp-badge");
            const oppDmgHeadersEl = document.getElementById("sky-opp-dmg-headers");
            const myDmgHeadersEl = document.getElementById("sky-my-dmg-headers");
            const timingRowsEl = document.getElementById("sky-move-timing-rows");
            const myTimingRowsEl = document.getElementById("sky-my-move-timing-rows");
            const matrixBody = document.getElementById("sky-matrix-body");

            const teamList = (battleData.team && battleData.team.length >= 3)
                ? battleData.team
                : [
                    { initial: "D", code: "DIA", name: "Dialga (Origin)" },
                    { initial: "L", code: "LUG", name: "Lugia" },
                    { initial: "K", code: "KYO", name: "Kyogre" }
                ];

            let activeSlotIdx = typeof battleData.activeUserSlotIndex === "number" ? battleData.activeUserSlotIndex : -1;
            if (activeSlotIdx < 0 || activeSlotIdx > 2) {
                activeSlotIdx = teamList.findIndex(m => (m.name || "").toLowerCase() === (battleData.userActivePokemon || "").toLowerCase());
                if (activeSlotIdx < 0) activeSlotIdx = 0;
            }

            const activeOppSlotIdx = typeof battleData.activeOpponentSlotIndex === "number" ? battleData.activeOpponentSlotIndex : 0;
            const pSlotHpArr = Array.isArray(battleData.playerSlotHpPct) ? battleData.playerSlotHpPct : [100, 100, 100];
            const oSlotHpArr = Array.isArray(battleData.oppSlotHpPct) ? battleData.oppSlotHpPct : [100, 100, 100];
            const activeUserHpVal = typeof battleData.activeUserHpPct === "number"
                ? Math.max(0, Math.min(100, Math.round(battleData.activeUserHpPct)))
                : (typeof pSlotHpArr[activeSlotIdx] === "number" ? Math.max(0, Math.min(100, Math.round(pSlotHpArr[activeSlotIdx]))) : 100);
            const activeOppHpVal = typeof battleData.activeOppHpPct === "number"
                ? Math.max(0, Math.min(100, Math.round(battleData.activeOppHpPct)))
                : (typeof oSlotHpArr[activeOppSlotIdx] === "number" ? Math.max(0, Math.min(100, Math.round(oSlotHpArr[activeOppSlotIdx]))) : 100);

            const activeUserEnergyVal = typeof battleData.activeUserEnergy === "number"
                ? Math.max(0, Math.min(100, Math.round(battleData.activeUserEnergy)))
                : 0;
            const activeOppEnergyVal = typeof battleData.activeOppEnergy === "number"
                ? Math.max(0, Math.min(100, Math.round(battleData.activeOppEnergy)))
                : 0;
            const activeOppEnergyLabel = battleData.activeOppEnergyLabel
                || (battleData.activeOppMoveReady ? `${activeOppEnergyVal}E READY` : `${activeOppEnergyVal}E`);

            const hpTrackingEnabled = !!battleData.enableHpTracking;
            const energyTrackingEnabled = !!battleData.enableEnergyTracking;

            const ocrMsBadgeEl = document.getElementById("sky-ocr-ms-badge");
            if (ocrMsBadgeEl) {
                const liveScanMs = (typeof battleData.lastScanDurationMs === "number" && battleData.lastScanDurationMs > 0)
                    ? Math.round(battleData.lastScanDurationMs)
                    : 0;
                const avgScanMs = (typeof battleData.lastBattleAvgScanMs === "number" && battleData.lastBattleAvgScanMs > 0)
                    ? Math.round(battleData.lastBattleAvgScanMs)
                    : (cachedLastBattleAvgScanMs > 0 ? Math.round(cachedLastBattleAvgScanMs) : 0);
                const displayOcrMs = isBattleActive
                    ? (liveScanMs > 0 ? liveScanMs : avgScanMs)
                    : (avgScanMs > 0 ? avgScanMs : liveScanMs);

                const liveHpMs = (typeof battleData.lastHpScanDurationMs === "number" && battleData.lastHpScanDurationMs > 0)
                    ? Math.round(battleData.lastHpScanDurationMs)
                    : 0;
                const avgHpMs = (typeof battleData.lastBattleAvgHpScanMs === "number" && battleData.lastBattleAvgHpScanMs > 0)
                    ? Math.round(battleData.lastBattleAvgHpScanMs)
                    : (cachedLastBattleAvgHpScanMs > 0 ? Math.round(cachedLastBattleAvgHpScanMs) : 0);
                const displayHpMs = isBattleActive
                    ? (liveHpMs > 0 ? liveHpMs : avgHpMs)
                    : (avgHpMs > 0 ? avgHpMs : liveHpMs);

                const hpPart = displayHpMs > 0 ? `${displayHpMs}ms` : "---ms";
                const ocrPart = displayOcrMs > 0 ? `${displayOcrMs}ms` : "---ms";
                ocrMsBadgeEl.textContent = `HP:${hpPart}/OCR:${ocrPart}`;
                if (displayHpMs > 0 || displayOcrMs > 0) {
                    const isAvgLabel = (!isBattleActive && (avgHpMs > 0 || avgScanMs > 0));
                    ocrMsBadgeEl.title = isAvgLabel
                        ? `Last Battle Avg — Pixel HP Loop: ${hpPart} • ML Kit OCR: ${ocrPart}`
                        : `Live Scan Rate — Pixel HP Loop: ${hpPart} • ML Kit OCR: ${ocrPart}`;
                } else {
                    ocrMsBadgeEl.title = "HP & OCR Update Rates: awaiting first scan";
                }
            }

            const myRowsForE = battleData.myMoveTimingRows || [];
            const myCheapestE = myRowsForE.length > 0
                ? Math.min(...myRowsForE.map(r => typeof r.energy === "number" ? r.energy : 50))
                : 35;
            const myMoveRdy = activeUserEnergyVal >= myCheapestE && myRowsForE.length > 0;

            const oppRowsForE = battleData.oppMoveTimingRows || [];
            const oppCheapestE = oppRowsForE.length > 0
                ? Math.min(...oppRowsForE.map(r => typeof r.energy === "number" ? r.energy : 50))
                : 35;
            const oppMoveRdy = !isWaitingState && (!!battleData.activeOppMoveReady || activeOppEnergyVal >= oppCheapestE || String(activeOppEnergyLabel).includes("READY"));

            const playerHpPillEl = document.getElementById("sky-player-hp-pill");
            const uCls = activeUserHpVal > 50 ? "hp-high" : (activeUserHpVal > 20 ? "hp-mid" : "hp-low");
            if (playerHpPillEl) {
                if (hpTrackingEnabled) {
                    playerHpPillEl.className = `hp-slot-pill ${uCls}`;
                    playerHpPillEl.textContent = `${activeUserHpVal}%`;
                    playerHpPillEl.title = `Your Active Pokémon HP: ${activeUserHpVal}%`;
                } else {
                    playerHpPillEl.className = "hp-slot-pill hidden";
                }
            }
            const playerEnergyPillEl = document.getElementById("sky-player-energy-pill");
            if (playerEnergyPillEl) {
                if (energyTrackingEnabled) {
                    playerEnergyPillEl.className = `energy-slot-pill ${myMoveRdy ? "ready" : "building"}`;
                    playerEnergyPillEl.textContent = myMoveRdy ? `${activeUserEnergyVal}E!` : `${activeUserEnergyVal}E`;
                    playerEnergyPillEl.title = `Your Active Pokémon Energy: ${activeUserEnergyVal}E`;
                } else {
                    playerEnergyPillEl.className = "energy-slot-pill hidden";
                }
            }
            const myAtkHpPillEl = document.getElementById("sky-my-atk-hp-pill");
            if (myAtkHpPillEl) {
                if (hpTrackingEnabled) {
                    myAtkHpPillEl.className = `hp-slot-pill ${uCls}`;
                    myAtkHpPillEl.textContent = `${activeUserHpVal}%`;
                    myAtkHpPillEl.title = `Your Active Pokémon HP: ${activeUserHpVal}%`;
                } else {
                    myAtkHpPillEl.className = "hp-slot-pill hidden";
                }
            }
            const myAtkEnergyPillEl = document.getElementById("sky-my-atk-energy-pill");
            if (myAtkEnergyPillEl) {
                if (energyTrackingEnabled) {
                    myAtkEnergyPillEl.className = `energy-slot-pill ${myMoveRdy ? "ready" : "building"}`;
                    myAtkEnergyPillEl.textContent = myMoveRdy ? `${activeUserEnergyVal}E READY` : `${activeUserEnergyVal}E`;
                    myAtkEnergyPillEl.title = `Your Active Pokémon Energy: ${activeUserEnergyVal}E`;
                } else {
                    myAtkEnergyPillEl.className = "energy-slot-pill hidden";
                }
            }

            const oppHpPillEl = document.getElementById("sky-opp-hp-pill");
            const oCls = isWaitingState ? "hp-high" : (activeOppHpVal > 50 ? "hp-high" : (activeOppHpVal > 20 ? "hp-mid" : "hp-low"));
            if (oppHpPillEl) {
                if (hpTrackingEnabled) {
                    oppHpPillEl.className = `hp-slot-pill ${oCls}`;
                    oppHpPillEl.textContent = isWaitingState ? "—" : `${activeOppHpVal}%`;
                    oppHpPillEl.title = isWaitingState ? "Waiting for opponent HP bar" : `Active Opponent HP: ${activeOppHpVal}%`;
                } else {
                    oppHpPillEl.className = "hp-slot-pill hidden";
                }
            }
            const oppEnergyPillEl = document.getElementById("sky-opp-energy-pill");
            if (oppEnergyPillEl) {
                if (energyTrackingEnabled) {
                    oppEnergyPillEl.className = `energy-slot-pill ${oppMoveRdy ? "ready" : "building"}`;
                    oppEnergyPillEl.textContent = isWaitingState ? "0E" : (oppMoveRdy ? `${activeOppEnergyVal}E!` : `${activeOppEnergyVal}E`);
                    oppEnergyPillEl.title = isWaitingState ? "Waiting for opponent energy" : `Active Opponent Energy: ${activeOppEnergyLabel}`;
                } else {
                    oppEnergyPillEl.className = "energy-slot-pill hidden";
                }
            }
            const oppAtkHpPillEl = document.getElementById("sky-opp-atk-hp-pill");
            if (oppAtkHpPillEl) {
                if (hpTrackingEnabled) {
                    oppAtkHpPillEl.className = `hp-slot-pill ${oCls}`;
                    oppAtkHpPillEl.textContent = isWaitingState ? "—" : `${activeOppHpVal}%`;
                    oppAtkHpPillEl.title = isWaitingState ? "Waiting for opponent HP bar" : `Active Opponent HP: ${activeOppHpVal}%`;
                } else {
                    oppAtkHpPillEl.className = "hp-slot-pill hidden";
                }
            }
            const oppAtkEnergyPillEl = document.getElementById("sky-opp-atk-energy-pill");
            if (oppAtkEnergyPillEl) {
                if (energyTrackingEnabled) {
                    oppAtkEnergyPillEl.className = `energy-slot-pill ${oppMoveRdy ? "ready" : "building"}`;
                    oppAtkEnergyPillEl.textContent = isWaitingState ? "0E" : activeOppEnergyLabel;
                    oppAtkEnergyPillEl.title = isWaitingState ? "Waiting for opponent energy" : `Active Opponent Energy: ${activeOppEnergyLabel}`;
                } else {
                    oppAtkEnergyPillEl.className = "energy-slot-pill hidden";
                }
            }

            const my3Letter = abbrPoke(battleData.userActivePokemon || "Lead", false);
            const userFastTelemetry = battleData.userFastTelemetry || `${abbrMove5(battleData.userFastMoveName || "Fast")} ${battleData.userFastMoveTurns || 2}t`;
            if (myShortEl) {
                const myHpSuffix = hpTrackingEnabled ? ` ${activeUserHpVal}%` : "";
                myShortEl.textContent = isWaitingState ? `${my3Letter}${myHpSuffix}` : `${my3Letter}${myHpSuffix} · ${userFastTelemetry}`;
            }

            if (isWaitingState) {
                if (oppNameEl) oppNameEl.textContent = "WAITING FOR OPPONENT...";
                if (oppMoveEl) oppMoveEl.textContent = "—";
                if (oppCmpBadgeEl) {
                    oppCmpBadgeEl.textContent = "CMP—";
                    oppCmpBadgeEl.className = "cmp-pill";
                }
                if (myCmpBadgeEl) {
                    myCmpBadgeEl.textContent = "CMP—";
                    myCmpBadgeEl.className = "cmp-pill";
                }
                if (oppDmgHeadersEl) oppDmgHeadersEl.innerHTML = "";
                if (myDmgHeadersEl) myDmgHeadersEl.innerHTML = "";
                if (timingRowsEl) timingRowsEl.innerHTML = "";
                if (myTimingRowsEl) myTimingRowsEl.innerHTML = "";
                const recRowWait = document.getElementById("sky-tactical-rec-row");
                const showRecWait = (isBattleActive || isReplay) && battleData.showTacticalRec !== false && battleData.showTacticalRecommendations !== false;
                if (recRowWait) {
                    if (showRecWait) {
                        const archWait = String(battleData.teamArchetype || "ABC").toUpperCase();
                        recRowWait.className = "tactical-rec-row rec-sky";
                        const actEl = document.getElementById("sky-rec-action");
                        const shEl = document.getElementById("sky-rec-shield");
                        const goalEl = document.getElementById("sky-rec-goal");
                        const swBtn = document.getElementById("sky-rec-swap-btn");
                        if (actEl) actEl.textContent = `[${archWait}] AWAITING LEAD`;
                        if (shEl) shEl.textContent = "[2S]";
                        if (goalEl) goalEl.textContent = "Goal: Scan opponent lead for live plan";
                        if (swBtn) swBtn.classList.add("hidden");
                        fitTacticalRecRow();
                    } else {
                        recRowWait.classList.add("hidden");
                    }
                }

                if (matrixBody) {
                    matrixBody.innerHTML = `
                        <div style="display:flex; align-items:center; gap:6px; color:#cbd5e1; font-size:9px; padding:2px 0;">
                            <span class="scan-indicator"></span>
                            <span>1 Hz OCR scanning top-left & top-right headers...</span>
                        </div>
                    `;
                }
            } else {
                const shadPrefix = battleData.isOpponentShadow ? "SHADOW " : "";
                if (oppNameEl) oppNameEl.textContent = "VS " + shadPrefix + (battleData.activeOpponent || "").toUpperCase();

                const opp3Letter = abbrPoke(battleData.activeOpponent || "Opp", false);
                const oppFastTelemetry = battleData.oppFastTelemetry
                    || `${abbrMove5(battleData.activeOpponentFastMove || "Fast")} ${battleData.activeOpponentTurns || 2}t`;
                const oppHpSuffix = hpTrackingEnabled ? ` ${activeOppHpVal}%` : "";
                const oppFastStatus = String(battleData.oppFastMoveStatus || "unconfirmed");
                const oppFastSpanCls = oppFastStatus === "confirmed_non_standard"
                    ? "opp-fast-nonstd-badge"
                    : (oppFastStatus === "confirmed_standard" ? "opp-fast-confirmed-std" : "opp-fast-unconfirmed");
                const oppFastTitle = oppFastStatus === "confirmed_non_standard"
                    ? "Confirmed Non-Standard Fast Move (>=10% HP damage check)"
                    : (oppFastStatus === "confirmed_standard"
                        ? "Confirmed Standard Fast Move (>=10% HP damage check)"
                        : "Unconfirmed Standard Fast Move (awaiting >=10% HP damage check)");
                if (oppMoveEl) {
                    oppMoveEl.innerHTML = `${opp3Letter}${oppHpSuffix} · <span class="${oppFastSpanCls}" title="${oppFastTitle}">${oppFastTelemetry}</span>`;
                }

                const winsCmp = battleData.winsCmp !== undefined ? !!battleData.winsCmp : true;
                const oppWinsCmp = !winsCmp;
                if (oppCmpBadgeEl) {
                    oppCmpBadgeEl.innerHTML = oppWinsCmp
                        ? 'CMP<span class="cmp-mark">✓</span>'
                        : 'CMP<span class="cmp-mark">✗</span>';
                    oppCmpBadgeEl.className = "cmp-pill " + (oppWinsCmp ? "win" : "loss");
                    oppCmpBadgeEl.title = oppWinsCmp ? "Opponent wins CMP tie" : "Opponent loses CMP tie";
                }
                if (myCmpBadgeEl) {
                    myCmpBadgeEl.innerHTML = winsCmp
                        ? 'CMP<span class="cmp-mark">✓</span>'
                        : 'CMP<span class="cmp-mark">✗</span>';
                    myCmpBadgeEl.className = "cmp-pill " + (winsCmp ? "win" : "loss");
                    myCmpBadgeEl.title = winsCmp ? "Your Pokémon wins CMP tie" : "Your Pokémon loses CMP tie";
                }

                // Render Lead & Swap Tactical Recommendation Row (between header-row and action-toolbar)
                try {
                    const recRowEl = document.getElementById("sky-tactical-rec-row");
                    const showRec = (isBattleActive || isReplay) && battleData.showTacticalRec !== false && battleData.showTacticalRecommendations !== false;
                    const rawRec = battleData.tacticalRec || battleData.tacticalRecommendation;
                    const arch = String((rawRec && rawRec.archetype) || battleData.teamArchetype || "ABC").toUpperCase();

                    let actionLabel = "";
                    let shieldPlan = "1S";
                    let goalText = "Hold Alignment";
                    let urg = "sky";
                    let recSlot = -1;

                    if (rawRec && (rawRec.actionLabel || rawRec.action)) {
                        const rawAction = String(rawRec.actionLabel || rawRec.action);
                        actionLabel = rawAction.startsWith("[") ? rawAction : `[${arch}] ${rawAction}`;
                        shieldPlan = String(rawRec.shieldPlan || "1S");
                        goalText = String(rawRec.goalText || rawRec.goal || "Hold Alignment");
                        if (rawRec.urgencyColor) {
                            urg = rawRec.urgencyColor;
                        } else if (rawRec.tone === "stay") {
                            urg = "emerald";
                        } else if (rawRec.tone === "swap") {
                            urg = "rose";
                        } else if (rawRec.tone === "bait" || rawRec.tone === "soft_loss") {
                            urg = "amber";
                        } else {
                            urg = "sky";
                        }
                        if (typeof rawRec.recommendedSwapSlotIndex === "number") {
                            recSlot = rawRec.recommendedSwapSlotIndex;
                        }
                    } else {
                        // Client-side fallback from 3v3 matrix if payload only provided scannedOpponents
                        const activeOppIdx = typeof battleData.activeOpponentSlotIndex === "number" ? battleData.activeOpponentSlotIndex : 0;
                        const oppEntry = (battleData.scannedOpponents && battleData.scannedOpponents[activeOppIdx])
                            || (battleData.scannedOpponents && battleData.scannedOpponents[0]);
                        const slotKey = activeSlotIdx === 1 ? "p2" : (activeSlotIdx === 2 ? "p3" : "p1");
                        const codeStr = (oppEntry && oppEntry.matrix && oppEntry.matrix[slotKey]) ? String(oppEntry.matrix[slotKey]) : "W,N,L";
                        const tiers = codeStr.split(",").map(s => s.trim());
                        const pShields = typeof battleData.player_shields_remaining === "number" ? battleData.player_shields_remaining : 2;
                        const oShields = typeof battleData.opponent_shields_remaining === "number" ? battleData.opponent_shields_remaining : 2;
                        const eqIdx = Math.max(0, Math.min(2, Math.min(pShields, oShields)));
                        const curTier = tiers[eqIdx] || "N";
                        const isWin = curTier === "SW" || curTier === "W";
                        const isNeutral = curTier === "N";
                        shieldPlan = tiers[0] === "SW" || tiers[0] === "W" ? "0S" : (tiers[1] === "SW" || tiers[1] === "W" ? "1S" : (pShields >= 2 && (tiers[2] === "SW" || tiers[2] === "W") ? "2S" : "0S"));
                        if (isWin) {
                            actionLabel = `[${arch}] STAY IN`;
                            goalText = curTier === "SW" ? "Dominate & Hold Switch" : "Win & Maintain Alignment";
                            urg = "emerald";
                        } else if (isNeutral) {
                            actionLabel = `[${arch}] STAY / SOFT LOSE`;
                            goalText = "Play +1 Shield or Farm Down";
                            urg = "amber";
                        } else {
                            const pivotSlot = activeSlotIdx === 0 ? 1 : 0;
                            const pivotMon = (teamList[pivotSlot] && (teamList[pivotSlot].code || abbrPoke(teamList[pivotSlot].name, false))) || "SWAP";
                            actionLabel = `[${arch}] SWAP -> ${pivotMon}`;
                            goalText = arch === "ABB" ? "Bait Backline Threat" : "Fight for Switch or +1S";
                            urg = "rose";
                            recSlot = pivotSlot;
                        }
                    }

                    if (recRowEl) {
                        if (showRec && actionLabel) {
                            recRowEl.className = `tactical-rec-row rec-${urg}`;
                            const actEl = document.getElementById("sky-rec-action");
                            const shEl = document.getElementById("sky-rec-shield");
                            const goalEl = document.getElementById("sky-rec-goal");
                            const swBtn = document.getElementById("sky-rec-swap-btn");
                            if (actEl) actEl.textContent = actionLabel;
                            if (shEl) shEl.textContent = `[${shieldPlan}]`;
                            if (goalEl) goalEl.textContent = `Goal: ${goalText}`;
                            if (swBtn) {
                                const isPostFaint = !!(battleData.isPostFaintSwitchPromptActive || (rawRec && rawRec.phase === "POST_FAINT_SWAP"));
                                if (recSlot >= 0 && recSlot <= 2 && (isPostFaint || recSlot !== activeSlotIdx)) {
                                    swBtn.classList.remove("hidden");
                                    swBtn.setAttribute("data-swap-slot", String(recSlot));
                                    swBtn.textContent = isPostFaint ? "Send In ➔" : "Swap ➔";
                                } else {
                                    swBtn.classList.add("hidden");
                                }
                            }
                            fitTacticalRecRow();
                        } else {
                            recRowEl.classList.add("hidden");
                        }
                    }
                } catch (e) {}

                // 1. Render 3v3 Battle Matrix FIRST in FIXED [1st seen, 2nd seen, 3rd seen] order
                //    v3.88: Top row shows player banked energy (e.g. D:60E | L:0E | K:-E) directly above each 3-dot column
                try {
                    if (matrixBody && battleData.scannedOpponents && battleData.scannedOpponents.length > 0) {
                        const ordLabels = ["1st", "2nd", "3rd"];
                        const pSlotEnergyArr = Array.isArray(battleData.playerSlotEnergy) ? battleData.playerSlotEnergy : [0, 0, 0];
                        const pSlotEverArr = Array.isArray(battleData.playerSlotEverOnField) ? battleData.playerSlotEverOnField : [true, false, false];
                        const pFaintedArr = Array.isArray(battleData.playerFaintedSlots) ? battleData.playerFaintedSlots : [false, false, false];
                        const buildPlayerColHeaderHtml = (slotIdx) => {
                            const member = teamList[slotIdx] || { initial: "P" + (slotIdx + 1) };
                            const init = member.initial || (member.name ? member.name.charAt(0).toUpperCase() : ("P" + (slotIdx + 1)));
                            const isFainted = !!pFaintedArr[slotIdx] || (typeof member.hpPct === "number" && member.hpPct <= 0);
                            const rawE = typeof member.energy === "number"
                                ? member.energy
                                : (typeof pSlotEnergyArr[slotIdx] === "number" ? pSlotEnergyArr[slotIdx] : (slotIdx === activeSlotIdx ? activeUserEnergyVal : 0));
                            const clampedE = isFainted ? 0 : Math.max(0, Math.min(100, Math.round(rawE)));
                            const hasEntered = (member.hasEnteredField !== undefined)
                                ? !!member.hasEnteredField
                                : (!!pSlotEverArr[slotIdx] || slotIdx === activeSlotIdx || clampedE > 0 || isFainted);
                            const eSuffix = member.bankedEnergyLabel
                                ? member.bankedEnergyLabel
                                : (isFainted ? "0E" : (hasEntered ? `${clampedE}E` : "-E"));
                            const cls = eSuffix === "-E"
                                ? "unseen-energy"
                                : (clampedE > 0 && !isFainted ? "has-energy" : "");
                            return `<span class="matrix-col-slot"><span class="team-initial ${cls}" title="${member.name || init}: ${eSuffix === '-E' ? 'Never entered field (-E)' : ('Banked Energy ' + eSuffix)}">${init}:${eSuffix}</span></span>`;
                        };
                        const matrixHeaderHtml = `
                        <div class="matrix-header-row">
                            <span class="matrix-opp-name" style="font-size:7.5px; color:#94a3b8; font-weight:700; letter-spacing:0.2px;">OPP / MY BANKED E</span>
                            <div class="matrix-team-block">
                                ${buildPlayerColHeaderHtml(0)}
                                <span class="divider">|</span>
                                ${buildPlayerColHeaderHtml(1)}
                                <span class="divider">|</span>
                                ${buildPlayerColHeaderHtml(2)}
                            </div>
                        </div>
                        `;
                        matrixBody.innerHTML = matrixHeaderHtml + battleData.scannedOpponents.map((opp, idx) => {
                            const isActiveOpp = (opp.isActive !== undefined) ? !!opp.isActive : (idx === activeOppSlotIdx);
                            const isOppShad = (opp.isShadow !== undefined) ? !!opp.isShadow : (isActiveOpp && battleData.isOpponentShadow);
                            const fullOppDisplay = (isOppShad ? "S-" : "") + (opp.name || opp.code);
                            const rawOppHp = typeof opp.hpPct === "number" ? opp.hpPct : (typeof oSlotHpArr[idx] === "number" ? oSlotHpArr[idx] : 100);
                            const oppFainted = (rawOppHp <= 0) || !!(battleData.oppFaintedSlots && battleData.oppFaintedSlots[idx]);
                            const oppSlotHp = oppFainted ? 0 : Math.max(0, Math.min(100, Math.round(rawOppHp)));
                            const hpCls = oppSlotHp > 50 ? "hp-high" : (oppSlotHp > 20 ? "hp-mid" : "hp-low");
                            const hpBadgeHtml = oppFainted
                                ? `<span class="hp-slot-pill hp-low">0%</span>`
                                : (hpTrackingEnabled ? `<span class="hp-slot-pill ${hpCls}">${oppSlotHp}%</span>` : "");
                            const oppEnergyArr = Array.isArray(battleData.oppSlotEnergy) ? battleData.oppSlotEnergy : [];
                            const rawOppE = typeof opp.energy === "number"
                                ? opp.energy
                                : (typeof oppEnergyArr[idx] === "number" ? oppEnergyArr[idx] : (isActiveOpp ? activeOppEnergyVal : 0));
                            const oppSlotE = oppFainted ? 0 : Math.max(0, Math.min(100, Math.round(rawOppE)));
                            const cheapestE = typeof opp.cheapestMoveEnergy === "number" ? opp.cheapestMoveEnergy : 35;
                            const isMoveRdy = !oppFainted && ((opp.isMoveReady !== undefined) ? !!opp.isMoveReady : (oppSlotE >= cheapestE));
                            const oppEnergyText = oppFainted
                                ? "0E"
                                : (opp.energyLabel || (isMoveRdy ? `${oppSlotE}E READY` : `${oppSlotE}E`));
                            const energyBadgeHtml = (oppFainted || !energyTrackingEnabled)
                                ? ""
                                : `<span class="energy-slot-pill ${isMoveRdy ? 'ready' : 'building'}" title="Opponent Energy: ${oppSlotE}E (Cheapest Charged Move: ${cheapestE}E)">${oppEnergyText}</span>`;
                            const p1Dots = renderTierDots(opp.matrix ? opp.matrix.p1 : "W,N,L");
                            const p2Dots = renderTierDots(opp.matrix ? opp.matrix.p2 : "N,N,N");
                            const p3Dots = renderTierDots(opp.matrix ? opp.matrix.p3 : "SW,W,W");
                            const ordTag = ordLabels[idx] || `#${idx + 1}`;
                            const rowFaintStyle = oppFainted && !isActiveOpp ? "opacity:0.55;" : "";
                            return `
                            <div class="matrix-row ${isActiveOpp ? 'active-lead' : ''}" onclick="swapOpponentByIndex(${idx})" style="cursor:pointer;${rowFaintStyle}" title="${isActiveOpp ? 'Active Opponent (' + ordTag + ' seen, ' + oppSlotHp + '% HP, ' + oppEnergyText + ')' : 'Tap to inspect/activate (' + ordTag + ' seen, ' + oppSlotHp + '% HP, ' + oppEnergyText + ')'}">
                                <span class="matrix-opp-name" title="${fullOppDisplay} (${oppSlotHp}% HP • ${oppEnergyText})">
                                    <span style="color:${isActiveOpp ? '#38bdf8' : '#64748b'}; font-weight:700; font-size:7.5px; margin-right:3px;">${ordTag}</span>
                                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;${oppFainted ? 'text-decoration:line-through;' : ''}">${fullOppDisplay}</span>
                                    ${hpBadgeHtml}${energyBadgeHtml}
                                </span>
                                <div class="matrix-team-block">
                                    <span class="matrix-col-slot"><span class="shield-dots">${p1Dots}</span></span>
                                    <span class="divider">|</span>
                                    <span class="matrix-col-slot"><span class="shield-dots">${p2Dots}</span></span>
                                    <span class="divider">|</span>
                                    <span class="matrix-col-slot"><span class="shield-dots">${p3Dots}</span></span>
                                </div>
                            </div>
                            `;
                        }).join("");
                    }
                } catch (e) {
                    console.error("Matrix render error", e);
                }

                // 2. Render Opponent Attacks 3-Column Header & Segmented Range Rows
                try {
                    if (oppDmgHeadersEl) {
                        oppDmgHeadersEl.innerHTML = teamList.slice(0, 3).map((member, idx) => {
                            const code = member.code || abbrPoke(member.name, false);
                            const isAct = (idx === activeSlotIdx);
                            const rawHp = typeof member.hpPct === "number" ? member.hpPct : (typeof pSlotHpArr[idx] === "number" ? pSlotHpArr[idx] : 100);
                            const isFainted = (rawHp <= 0) || (!isAct && !!(battleData.playerFaintedSlots && battleData.playerFaintedSlots[idx]));
                            const slotHp = isFainted ? 0 : Math.max(0, Math.min(100, Math.round(rawHp)));
                            const hpColor = isFainted ? "#64748b" : (slotHp > 50 ? "#6ee7b7" : (slotHp > 20 ? "#fde047" : "#fca5a5"));
                            const faintCls = isFainted ? "col-fainted" : "";
                            return `<span class="dmg-col-hdr ${isAct && !isFainted ? 'active-col' : ''} ${faintCls}" onclick="selectUserPokemonByIndex(${idx})" style="cursor:pointer;" title="${member.name || code} (${slotHp}% HP)"><span class="dmg-col-hdr-code">${code}</span><span class="dmg-col-hdr-hp" style="color:${hpColor};">${slotHp}%</span></span>`;
                        }).join("");
                    }

                    if (timingRowsEl) {
                        const rows = battleData.oppMoveTimingRows || [];
                        timingRowsEl.innerHTML = rows.map(row => {
                            const shortMove = row.shortName || abbrMove5(row.name || "Move");
                            const actvPct = row.activeDmgPct || 35;
                            const actvEff = row.activeEff || 1.0;
                            const threatClass = (actvPct >= 60 || actvEff >= 1.5) ? "high" : ((actvPct <= 30 || (actvEff <= 0.65 && actvPct < 45)) ? "low" : "mid");
                            const myTapReady = row.myTapAtReady || 4;
                            const displayReadyCount = row.displayReadyCount || myTapReady;
                            const rowWinsCmp = row.winsCmp !== undefined ? !!row.winsCmp : winsCmp;

                            let cyclesHtml = "";
                            if (row.cycles && row.cycles.length > 0) {
                                cyclesHtml = row.cycles.map(cycle => {
                                    const wPct = typeof cycle.widthPct === "number" ? cycle.widthPct.toFixed(2) : "100";
                                    const rangePart = cycle.rangeLabel
                                        ? `<span class="seg-block seg-range seg-safe" title="Turns ${cycle.startTurn + 1}–${cycle.readyTurn}">${cycle.rangeLabel}</span>`
                                        : "";
                                    const readyCls = cycle.readyState === "cmp" ? "seg-cmp" : "seg-catch";
                                    const readyTitle = cycle.readyState === "cmp"
                                        ? `Cycle ${cycle.cycleIndex}: Ready at Turn ${cycle.readyTurn} (CMP Win)`
                                        : `Cycle ${cycle.cycleIndex}: Opponent can throw at Turn ${cycle.readyTurn} (Catch)`;
                                    return `
                                        <div class="seg-cycle-group" style="width:${wPct}%;">
                                            ${rangePart}
                                            <span class="seg-block seg-ready ${readyCls}" title="${readyTitle}">${cycle.readyLabel}</span>
                                        </div>
                                    `;
                                }).join("");
                            } else {
                                const safeLabel = row.safeRangeLabel || (displayReadyCount <= 1 ? "1" : `1–${displayReadyCount - 1}`);
                                const actionBlock = rowWinsCmp
                                    ? `<span class="seg-block seg-ready seg-cmp" title="CMP Win on #${displayReadyCount}">#${displayReadyCount}</span>`
                                    : `<span class="seg-block seg-ready seg-catch" title="Opponent can throw on #${displayReadyCount} (Catch)">#${displayReadyCount}</span>`;
                                cyclesHtml = `
                                    <div class="seg-cycle-group" style="width:100%;">
                                        <span class="seg-block seg-range seg-safe">${safeLabel}</span>
                                        ${actionBlock}
                                    </div>
                                `;
                            }

                            const centerHtml = `<div class="seg-bar-track">${cyclesHtml}</div>`;

                            // 3-Column Team Damage Matrix with Vertical Active Column Highlight & Faint Dimming
                            let teamDamages = row.teamDamages;
                            if (!teamDamages || teamDamages.length < 3) {
                                teamDamages = teamList.slice(0, 3).map((m, idx) => ({
                                    code: m.code || abbrPoke(m.name, false),
                                    dmgPct: idx === activeSlotIdx ? actvPct : 40,
                                    tier: "neutral",
                                    isActive: idx === activeSlotIdx
                                }));
                            }

                            const rightGridHtml = teamDamages.slice(0, 3).map((td, idx) => {
                                const isAct = td.isActive !== undefined ? !!td.isActive : (idx === activeSlotIdx);
                                const isFainted = !isAct && !!(battleData.playerFaintedSlots && battleData.playerFaintedSlots[idx]);
                                const faintCls = isFainted ? "col-fainted" : "";
                                const tierCls = td.tier === "resist" ? "tier-resist" : (td.tier === "weak" ? "tier-weak" : "tier-neutral");
                                const targetHp = typeof pSlotHpArr[idx] === "number" ? pSlotHpArr[idx] : 100;
                                const isKo = !isFainted && targetHp > 0 && td.dmgPct >= targetHp;
                                const koCls = isKo ? "dmg-ko" : "";
                                const labelTxt = isKo ? `${td.dmgPct}% KO` : `${td.dmgPct}%`;
                                return `<div class="dmg-cell ${tierCls} ${isAct && !isFainted ? 'active-col' : ''} ${faintCls} ${koCls}" title="${td.code || ''}: ${td.dmgPct}% dmg vs ${targetHp}% HP">${labelTxt}</div>`;
                            }).join("");

                            const isConfirmedMove = !!row.isConfirmedMove || (
                                Array.isArray(battleData.confirmedOppChargedMoves) &&
                                battleData.confirmedOppChargedMoves.some(m => String(m).toLowerCase() === String(row.name || "").toLowerCase())
                            );
                            const confirmedBadgeCls = isConfirmedMove ? " move-confirmed-badge" : "";
                            const confirmedTitleSuffix = isConfirmedMove ? " (Confirmed Used in Battle)" : "";
                            const moveCostVal = row.energy || 50;
                            const isOppMoveFunded = energyTrackingEnabled && !isWaitingState && (activeOppEnergyVal >= moveCostVal);
                            const oppEnergyReadyCls = isOppMoveFunded ? " energy-ready" : "";
                            return `
                                <div class="move-timing-row">
                                    <div class="move-col-left">
                                        <div class="move-title-line threat-${threatClass}${confirmedBadgeCls}" title="${row.name || ''}${confirmedTitleSuffix}">${shortMove}</div>
                                        <div class="move-sub-line${oppEnergyReadyCls}">${moveCostVal}e/${displayReadyCount}f</div>
                                    </div>
                                    <div class="move-col-center">${centerHtml}</div>
                                    <div class="move-col-right-grid">${rightGridHtml}</div>
                                </div>
                            `;
                        }).join("");
                    }
                } catch (e) {
                    console.error("Opponent attacks render error", e);
                }

                // 3. Render My Attacks 3-Column Opponent Header (Fixed 1st/2nd/3rd seen order) & Zero-Sneak Segmented Range Rows
                try {
                    const scanned = battleData.scannedOpponents || [];
                    if (myDmgHeadersEl) {
                        myDmgHeadersEl.innerHTML = [0, 1, 2].map(idx => {
                            const opp = scanned[idx];
                            const isAct = opp && opp.isActive !== undefined ? !!opp.isActive : (idx === activeOppSlotIdx);
                            const isShad = opp && opp.isShadow !== undefined ? !!opp.isShadow : (isAct && battleData.isOpponentShadow);
                            const code = opp ? (opp.code || abbrPoke(opp.name, isShad)) : "—";
                            const rawOppHp = opp ? (typeof opp.hpPct === "number" ? opp.hpPct : (typeof oSlotHpArr[idx] === "number" ? oSlotHpArr[idx] : 100)) : null;
                            const isFainted = opp ? ((rawOppHp !== null && rawOppHp <= 0) || (!isAct && !!(battleData.oppFaintedSlots && battleData.oppFaintedSlots[idx]))) : false;
                            const slotHp = opp ? (isFainted ? 0 : Math.max(0, Math.min(100, Math.round(rawOppHp !== null ? rawOppHp : 100)))) : null;
                            const hpText = slotHp !== null ? `${slotHp}%` : "—";
                            const hpColor = !opp ? "#475569" : (isFainted ? "#64748b" : (slotHp > 50 ? "#6ee7b7" : (slotHp > 20 ? "#fde047" : "#fca5a5")));
                            const faintCls = isFainted ? "col-fainted" : "";
                            const clickAttr = opp ? `onclick="swapOpponentByIndex(${idx})" style="cursor:pointer;" title="${opp.name || code} (${slotHp}% HP)"` : "";
                            return `<span class="dmg-col-hdr ${opp && isAct && !isFainted ? 'active-col' : ''} ${faintCls}" ${clickAttr}><span class="dmg-col-hdr-code">${code}</span><span class="dmg-col-hdr-hp" style="color:${hpColor};">${hpText}</span></span>`;
                        }).join("");
                    }

                    if (myTimingRowsEl) {
                        const myRows = battleData.myMoveTimingRows || [];
                        myTimingRowsEl.innerHTML = myRows.map(row => {
                            const shortMove = row.shortName || abbrMove5(row.name || "Move");
                            const dmgPct = row.dmgPct || 40;
                            const eff = row.eff || 1.0;
                            const myTaps = row.myTapsNeeded || 4;
                            const threatClass = (dmgPct >= 65 || eff >= 1.5) ? "low" : ((dmgPct <= 30 || eff <= 0.65) ? "high" : "mid");

                            let cyclesHtml = "";
                            if (row.cycles && row.cycles.length > 0) {
                                cyclesHtml = row.cycles.map(cycle => {
                                    const wPct = typeof cycle.widthPct === "number" ? cycle.widthPct.toFixed(2) : "100";
                                    const rangeCls = cycle.hasZeroSneak ? "seg-safe" : "seg-uncharged";
                                    const rangeTitle = cycle.hasZeroSneak
                                        ? `Zero-sneak leak-free taps: ${cycle.rangeLabel}`
                                        : `Charging taps: ${cycle.rangeLabel}`;
                                    const rangePart = cycle.rangeLabel
                                        ? `<span class="seg-block seg-range ${rangeCls}" title="${rangeTitle}">${cycle.rangeLabel}</span>`
                                        : "";
                                    const readyCls = cycle.readyState === "cmp"
                                        ? "seg-cmp"
                                        : cycle.readyState === "cmp-loss"
                                        ? "seg-catch"
                                        : "seg-safe";
                                    const readyTitle = cycle.readyState === "cmp"
                                        ? `Cycle ${cycle.cycleIndex}: Ready on #${cycle.readyTap} at Turn ${cycle.readyTurn} (CMP Win)`
                                        : cycle.readyState === "cmp-loss"
                                        ? `Cycle ${cycle.cycleIndex}: Ready on #${cycle.readyTap} at Turn ${cycle.readyTurn} (CMP Loss)`
                                        : `Cycle ${cycle.cycleIndex}: Ready on #${cycle.readyTap} at Turn ${cycle.readyTurn}`;
                                    return `
                                        <div class="seg-cycle-group" style="width:${wPct}%;">
                                            ${rangePart}
                                            <span class="seg-block seg-ready ${readyCls}" title="${readyTitle}">${cycle.readyLabel}</span>
                                        </div>
                                    `;
                                }).join("");
                            } else {
                                const rangeLabel = row.safeThrowLabel || (myTaps <= 1 ? "1" : `1–${myTaps - 1}`);
                                const rangeCls = row.hasZeroSneak ? "seg-safe" : "seg-uncharged";
                                const readyBlock = row.state === "cmp"
                                    ? `<span class="seg-block seg-ready seg-cmp" title="Ready on #${myTaps} (CMP Win)">#${myTaps}</span>`
                                    : row.state === "cmp-loss"
                                    ? `<span class="seg-block seg-ready seg-catch" title="Ready on #${myTaps} (CMP Loss)">#${myTaps}</span>`
                                    : `<span class="seg-block seg-ready seg-safe" title="Ready on #${myTaps}">#${myTaps}</span>`;
                                cyclesHtml = `
                                    <div class="seg-cycle-group" style="width:100%;">
                                        <span class="seg-block seg-range ${rangeCls}">${rangeLabel}</span>
                                        ${readyBlock}
                                    </div>
                                `;
                            }

                            const centerHtml = `<div class="seg-bar-track">${cyclesHtml}</div>`;

                            let oppDamages = row.oppDamages;
                            if (!oppDamages || oppDamages.length < 3) {
                                oppDamages = [0, 1, 2].map(idx => ({
                                    code: scanned[idx] ? abbrPoke(scanned[idx].name, false) : "—",
                                    dmgPct: idx === 0 ? dmgPct : null,
                                    tier: idx === 0 ? (dmgPct >= 65 ? "high" : (dmgPct <= 35 ? "low" : "neutral")) : "empty",
                                    isActive: idx === 0
                                }));
                            }

                            const rightGridHtml = oppDamages.slice(0, 3).map((od, idx) => {
                                const isAct = od.isActive !== undefined ? !!od.isActive : (idx === 0);
                                const isFainted = !isAct && !!(battleData.oppFaintedSlots && battleData.oppFaintedSlots[idx]);
                                const faintCls = isFainted ? "col-fainted" : "";
                                if (od.dmgPct === null || od.dmgPct === undefined || od.tier === "empty") {
                                    return `<div class="dmg-cell tier-empty ${isAct && !isFainted ? 'active-col' : ''} ${faintCls}">—</div>`;
                                }
                                const tierCls = od.tier === "high" ? "tier-high" : (od.tier === "low" ? "tier-low" : "tier-neutral");
                                const targetHp = typeof oSlotHpArr[idx] === "number" ? oSlotHpArr[idx] : 100;
                                const isKo = !isFainted && targetHp > 0 && od.dmgPct >= targetHp;
                                const koCls = isKo ? "dmg-ko" : "";
                                const text = od.dmgPct >= 100 ? "KO!" : (isKo ? `${od.dmgPct}% KO` : `${od.dmgPct}%`);
                                return `<div class="dmg-cell ${tierCls} ${isAct && !isFainted ? 'active-col' : ''} ${faintCls} ${koCls}" title="${od.code || ''}: ${od.dmgPct}% dmg vs ${targetHp}% HP">${text}</div>`;
                            }).join("");

                            const myMoveCostVal = row.energy || 50;
                            const isMyMoveFunded = energyTrackingEnabled && (activeUserEnergyVal >= myMoveCostVal);
                            const myEnergyReadyCls = isMyMoveFunded ? " energy-ready" : "";
                            return `
                                <div class="move-timing-row">
                                    <div class="move-col-left">
                                        <div class="move-title-line threat-${threatClass}" title="${row.name || ''}">${shortMove}</div>
                                        <div class="move-sub-line${myEnergyReadyCls}">${myMoveCostVal}e/${myTaps}f</div>
                                    </div>
                                    <div class="move-col-center">${centerHtml}</div>
                                    <div class="move-col-right-grid">${rightGridHtml}</div>
                                </div>
                            `;
                        }).join("");
                    }
                } catch (e) {
                    console.error("My attacks render error", e);
                }
            }

            // Render Option 2 (Horizon Belt)
            try {
                const horizonTitle = document.getElementById("horizon-opp-title");
                const horizonDots = document.getElementById("horizon-matrix-dots");
                const horizonThrow = document.getElementById("horizon-throw-timing");
                const horizonDmg = document.getElementById("horizon-dmg-summary");

                if (isWaitingState) {
                    if (horizonTitle) horizonTitle.textContent = "[Waiting for Opponent]";
                    if (horizonDots) horizonDots.textContent = "1 Hz OCR active...";
                    if (horizonThrow) horizonThrow.textContent = "—";
                    if (horizonDmg) horizonDmg.textContent = "Awaiting opponent...";
                } else {
                    const oppFastTelemetry = battleData.oppFastTelemetry
                        || `${abbrMove5(battleData.activeOpponentFastMove || "Fast")} ${battleData.activeOpponentTurns || 2}t`;
                    if (horizonTitle) horizonTitle.textContent = `[${battleData.activeOpponent}: ${oppFastTelemetry}]`;
                    if (horizonThrow) horizonThrow.textContent = battleData.throwHorizonText || "1st, 3rd, 5th";
                    if (horizonDots && battleData.scannedOpponents && battleData.scannedOpponents.length > 0) {
                        horizonDots.innerHTML = battleData.scannedOpponents.map((opp, idx) => `
                            <strong>${opp.name}</strong> <span class="shield-dots">${renderTierDots(opp.matrix ? opp.matrix.p1 : "W,N,L")}</span>
                            ${idx < battleData.scannedOpponents.length - 1 ? ' • ' : ''}
                        `).join("");
                        if (horizonDmg) {
                            horizonDmg.textContent = `Opp: ${abbrMoveSummary(battleData.scannedOpponents[0].c1)} • My: ${abbrMoveSummary(battleData.myMove1Summary || '—')}`;
                        }
                    }
                }
            } catch (e) {
                console.error("Horizon render error", e);
            }

            if (window.requestAnimationFrame) {
                window.requestAnimationFrame(notifyHeight);
            }
            setTimeout(notifyHeight, 40);
        }

        window.addEventListener("resize", function() {
            applyProportionalScale();
            notifyHeight();
        });

        window.onload = function() {
            if (window.location.search && window.location.search.includes("replay=1")) {
                document.body.style.overflowY = "visible";
            }
            applyProportionalScale();
            render();
            if (window.AndroidOverlay && window.AndroidOverlay.onOverlayReady) {
                window.AndroidOverlay.onOverlayReady();
            }
            notifyHeight();
        };
    </script>
</body>
</html>
