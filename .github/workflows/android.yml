name: Build Android APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

      workflow_version:
        description: 'Optional release version override (e.g. v1.01)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.workflow_version }}" ]; then
            RAW_VER="${{ github.event.inputs.workflow_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VER="v1.00"
          fi
          CLEAN_NUM="${RAW_VER#v}"
          TAG_NAME="v${CLEAN_NUM}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_num=${CLEAN_NUM}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${TAG_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore via keytool..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias gblkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gblrelease123 \
              -keypass gblrelease123 \
              -dname "CN=SilphScope PvP, OU=Android, O=SilphScope, C=US"
          else
            echo "Release keystore is present at app/release.keystore"
          fi

      - name: Build Release APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Named Release APK for Public Download
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk"

      - name: Build Debug APK
        if: github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-release-apk
          path: app/build/outputs/apk/release/named/silphscope-pvp-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always() && (github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both')
        with:
          name: silphscope-pvp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SilphScope PvP ${{ steps.version.outputs.tag }}"
          body: |
            ## SilphScope PvP ${{ steps.version.outputs.tag }} — Official v3.60 Release (Predictive + Self-Correcting Bias-Error Energy Loop, Opt-In HP & Energy Tracking Settings, Streamlined Header Row & 2s Hold Minimize to Battle Log)
            
            > **⚠️ IMPORTANT NOTE (Default Settings)**: **Live HP Bar Tracking** and **Live Energy & Fast-Move Counting** are **DISABLED (OFF) by default** (including for any user upgrading from `< v3.40`). To enable live HP% or Energy tracking in the overlay, open **⚙️ Settings** in the app and opt in to **❤️ Live HP Bar Tracking** and/or **⚡ Live Energy & Fast-Move Counting**.
            
            ### What's New in v3.60
            - **Predictive + Self-Correcting Bias-Error Energy & Turn Loop (`OverlayService.kt`)**:
              - Combines **zero-lag feed-forward prediction** (advancing energy in sync with fast-move turn cadence and locking 2T+ move phase when a pending-damage flash is observed) with **closed-loop bias-error self-correction** (online EMA per-move damage calibration $\hat{d}$ for non-standard IVs/under-leveled CP plus damped $\pm 1$ move residual correction and automatic rollback if HP does not drop after `fastTurns * 500ms + 420ms`).
              - Eliminates energy lag behind damage as well as overcounting, undercounting, and feedback-loop oscillation so charged-move `READY` warnings fire at the exact turn energy becomes usable.
            - **Opt-In Settings to Enable/Disable HP Tracking & Energy Tracking (`MainActivity.kt`, `OverlayService.kt`, `overlay.html`)**:
              - Added independent toggles in **⚙️ Settings**:
                1. **❤️ Live HP Bar Tracking (Overlay)** — **Default: OFF** (opt-in via Settings).
                2. **⚡ Live Energy & Fast-Move Counting (Overlay)** — **Default: OFF** (opt-in via Settings).
              - Automatically defaults both settings to **OFF** for any new install or user upgrading from a version prior to `v3.40`.
            - **Streamlined Overlay Header Row & 2-Second Hold to Stop Overlay & Open Battle Log (`overlay.html`, `OverlayService.kt`)**:
              - Redesigned the top `.header-row` to display **ONLY**:
                1. **Minimize / Pause OCR Icon** (`#btn-minimize-sword`)
                2. **OCR Update Rate in `ms`** (`#sky-ocr-ms-badge`, e.g. `220ms`)
                3. **My Health, Energy & Shield Badges** (`My 100%`, `0E`, `🛡️ 2`)
                4. **Opp Shields, Health & Energy Badges** (`🛡️ 2`, `Opp 100%`, `0E`)
              - **2-Second Long-Press on Minimize Icon**: Pressing and holding the top-left Minimize icon for **2 seconds (`2000ms`)** when not minimized immediately **stops the floating overlay and opens the main app directly to the 📜 Battle Log page**. A short tap (`< 2s`) minimizes to the floating bubble and pauses OCR as usual.
            
            ### Live Web Simulator & Download
            - **Live Web Simulator**: [https://sportsfan986.github.io/silphscope-pvp/](https://sportsfan986.github.io/silphscope-pvp/)
            - **Android APK**: Download **`silphscope-pvp-${{ steps.version.outputs.tag }}.apk`** from the **Assets** section below and install on your Android device.
          files: |
            app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

