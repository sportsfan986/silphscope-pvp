name: Build Android APK

concurrency:
  group: "android-build"
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

      workflow_version:
        description: 'Optional release version override (e.g. v1.01)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.workflow_version }}" ]; then
            RAW_VER="${{ github.event.inputs.workflow_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          elif [ -f app/build.gradle.kts ] && grep -q 'versionName' app/build.gradle.kts; then
            RAW_VER=$(grep -E 'versionName\s*=\s*' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VER="v1.00"
          fi
          CLEAN_NUM="${RAW_VER#v}"
          TAG_NAME="v${CLEAN_NUM}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_num=${CLEAN_NUM}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${TAG_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore via keytool..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias gblkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gblrelease123 \
              -keypass gblrelease123 \
              -dname "CN=SilphScope PvP, OU=Android, O=SilphScope, C=US"
          else
            echo "Release keystore is present at app/release.keystore"
          fi

      - name: Build Release APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Named Release APK for Public Download
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk"

      - name: Build Debug APK
        if: github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-release-apk
          path: app/build/outputs/apk/release/named/silphscope-pvp-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always() && (github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both')
        with:
          name: silphscope-pvp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: create_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SilphScope PvP ${{ steps.version.outputs.tag }}"
          body: |
            ## SilphScope PvP ${{ steps.version.outputs.tag }} — Official Release (v3.93 Opponent Used-Move Badge Restoration & 100E Ceiling Step Latch)

            ### Release Series Context (`v4.00` – `v4.01`)
            *Introduces fast-move turn increment snapping with post-throw discharge anchoring, the 4-tier color-coded (Red / Orange / Yellow / Green) "Attack incoming!" Shield Decision Overlay, v4.01 restoration of v3.93 opponent used charged move badges across both shielded and unshielded attacks, and 100E ceiling step latching after 1 fast-move duration.*

            ### Key Features in `${{ steps.version.outputs.tag }}`
            - **Restored `v3.93` Opponent Used Charged Move Badges (`✓` Badge & 2-Move Lock) Across Shielded & Unshielded Moves**:
              - **100ms Pixel Shield-Prompt Dismissal (`detectAttackIncomingShieldHexagonPixels`)**: Detects the instant the purple Protect Shield hexagon disappears when the player taps Shield or `"NOT NOW"` so the Shield Decision Overlay hides in `<100ms` (before `"<Opponent> used <Move>!"` appears for OCR) and keeps its bounds below `srcMidBanner`.
              - **Debounced Post-Charge HP Sync & Retroactive HP-Delta Move Confirmation**: Prevents premature Frame-1 post-charge reconciliation before the player's post-hit HP is debounced (`hpDelta > 0`), and retroactively confirms `strictHpMove ?: bestGuessHpMove` if a player HP drop arrives immediately after Section 4.
              - **Canonicalized Banner Move Matching (`handleMidBannerUsedMoveLines`)**: Matches `"<Opponent> used <Move>!"` across both `midBannerLines` and `playerMoveLines`, canonicalizes the move name against the opponent slot's 4 displayed moves, and updates `confirmedOppChargedMoves` both during and up to `4.5s` after Section 4 reconciliation.
            - **100E vs 99E Energy Ceiling Latch After 1 Fast-Move Duration (`snapPlayerEnergyToValidStep` & `nearCeilingStepStartMs`)**:
              - When a valid fast-move step lands below `100E` such that the next uncapped step (`step + fastMoveEnergy`) would exceed `100E` (e.g., `99E` on `9E Ember` where step 12 would be `108E`), snaps to `99E` first and latches onto `100E` after `1` fast-move duration (`userMoveDurationMs`) of active combat if no energy has been deducted.
            - **Carried Forward from `v4.00` — Fast-Move Increment Snapping & 4-Tier "Attack Incoming!" Shield Decision Overlay**:
              - Snaps player energy to valid fast-move turn increments relative to the post-throw discharge anchor (`playerSlotEnergyAnchor`) and displays the Red / Orange / Yellow / Green Shield Decision Overlay above `"Attack incoming! Use a Protect Shield?"`.

            ### Live Web Simulator & Download
            - **Live Web Simulator**: [https://sportsfan986.github.io/silphscope-pvp/](https://sportsfan986.github.io/silphscope-pvp/)
            - **Full Release History**: [CHANGELOG.md](https://github.com/sportsfan986/silphscope-pvp/blob/main/CHANGELOG.md)
            - **Android APK**: Download **`silphscope-pvp-${{ steps.version.outputs.tag }}.apk`** from the **Assets** section below and install on your Android device.
          files: |
            app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Release Asset Uploaded (Fallback)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK_FILE="app/build/outputs/apk/release/named/silphscope-pvp-${TAG}.apk"
          if [ -f "$APK_FILE" ]; then
            echo "Ensuring release asset is attached to $TAG via gh CLI..."
            gh release upload "$TAG" "$APK_FILE" --clobber || echo "Asset already up to date"
          fi


