name: Build Android APK

concurrency:
  group: "android-build-${{ github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      workflow_version:
        description: 'Optional release version override (e.g. v6.21)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve Release Version
        id: version
        env:
          INPUT_VER: ${{ github.event.inputs.workflow_version }}
          REF_NAME: ${{ github.ref_name }}
          REF_FULL: ${{ github.ref }}
        run: |
          if [ -n "$INPUT_VER" ]; then
            RAW_VER="$INPUT_VER"
          elif [[ "$REF_FULL" == refs/tags/* ]]; then
            RAW_VER="$REF_NAME"
          elif [ -f app/build.gradle.kts ] && grep -q 'versionName' app/build.gradle.kts; then
            RAW_VER=$(grep -E 'versionName\s*=\s*' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VER="v6.21"
          fi
          CLEAN_NUM="${RAW_VER#v}"
          if ! [[ "$CLEAN_NUM" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Invalid release version format: $RAW_VER"
            exit 1
          fi
          TAG_NAME="v${CLEAN_NUM}"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_num=${CLEAN_NUM}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${TAG_NAME}"

      - name: Extract Release Notes from CHANGELOG.md
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          NOTES=$(awk -v tag="$TAG" '$0 ~ "^## " tag " " {flag=1} flag{if(/^---$/){exit} print}' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES=$(awk '/^## v[0-9]/{if(found) exit; found=1} found{if(/^---$/){exit} print}' CHANGELOG.md)
          fi
          {
            if [ -n "$NOTES" ]; then
              echo "$NOTES"
            else
              echo "## SilphScope PvP ${TAG} — Official Release"
            fi
            echo ""
            echo "### Live Web Simulator & Download"
            echo "- **Live Web Simulator**: [https://sportsfan986.github.io/silphscope-pvp/](https://sportsfan986.github.io/silphscope-pvp/)"
            echo "- **Full Release History**: [CHANGELOG.md](https://github.com/sportsfan986/silphscope-pvp/blob/main/CHANGELOG.md)"
            echo "- **Android APK**: Download **\`silphscope-pvp-${TAG}.apk\`** from the **Assets** section below and install on your Android device."
          } > release_notes.md

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Decode Release Keystore & Rotation Lineage
        if: github.event_name != 'pull_request' && (github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push')
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_LINEAGE_B64: ${{ secrets.RELEASE_LINEAGE_B64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_B64 secret is missing. Configure repository signing secrets in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          if [ -n "$RELEASE_LINEAGE_B64" ]; then
            echo "$RELEASE_LINEAGE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/rotation.lineage"
            echo "RELEASE_LINEAGE_PATH=$RUNNER_TEMP/rotation.lineage" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: ${{ github.event_name != 'pull_request' }}
        run: ./gradlew assembleRelease --build-cache --no-daemon --stacktrace -Dorg.gradle.internal.http.retry.max.attempts=5

      - name: Re-sign Release APK with v3 Key Rotation Lineage & Prepare Named APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p app/build/outputs/apk/release/named
          SRC_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          OUT_APK="app/build/outputs/apk/release/named/silphscope-pvp-${TAG}.apk"
          cp "$SRC_APK" "$OUT_APK"
          if [ -n "${RELEASE_LINEAGE_PATH:-}" ] && [ -f "$RELEASE_LINEAGE_PATH" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
            echo "Applying APK Signature Scheme v3 key rotation lineage via $APKSIGNER..."
            "$APKSIGNER" sign \
              --v1-signing-enabled false \
              --v2-signing-enabled false \
              --v3-signing-enabled true \
              --ks "$RELEASE_KEYSTORE_PATH" \
              --ks-key-alias "${RELEASE_KEY_ALIAS:-silphscope}" \
              --ks-pass env:RELEASE_STORE_PASSWORD \
              --key-pass env:RELEASE_KEY_PASSWORD \
              --lineage "$RELEASE_LINEAGE_PATH" \
              --rotation-min-sdk-version 31 \
              --min-sdk-version 31 \
              "$OUT_APK"
            "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 31 "$OUT_APK"
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-release-apk
          path: app/build/outputs/apk/release/named/silphscope-pvp-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: create_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SilphScope PvP ${{ steps.version.outputs.tag }}"
          body_path: release_notes.md
          files: |
            app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Release Asset Uploaded (Fallback)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          APK_FILE="app/build/outputs/apk/release/named/silphscope-pvp-${TAG}.apk"
          if [ -f "$APK_FILE" ]; then
            echo "Ensuring release asset is attached to $TAG via gh CLI..."
            gh release upload "$TAG" "$APK_FILE" --clobber || echo "Asset already up to date"
          fi
