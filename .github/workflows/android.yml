name: Build Android APK

concurrency:
  group: "android-build"
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

      workflow_version:
        description: 'Optional release version override (e.g. v1.01)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.workflow_version }}" ]; then
            RAW_VER="${{ github.event.inputs.workflow_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          elif [ -f app/build.gradle.kts ] && grep -q 'versionName' app/build.gradle.kts; then
            RAW_VER=$(grep -E 'versionName\s*=\s*' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          else
            RAW_VER="v1.00"
          fi
          CLEAN_NUM="${RAW_VER#v}"
          TAG_NAME="v${CLEAN_NUM}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_num=${CLEAN_NUM}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${TAG_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore via keytool..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias gblkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gblrelease123 \
              -keypass gblrelease123 \
              -dname "CN=SilphScope PvP, OU=Android, O=SilphScope, C=US"
          else
            echo "Release keystore is present at app/release.keystore"
          fi

      - name: Build Release APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Named Release APK for Public Download
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk"

      - name: Build Debug APK
        if: github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-release-apk
          path: app/build/outputs/apk/release/named/silphscope-pvp-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always() && (github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both')
        with:
          name: silphscope-pvp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: create_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SilphScope PvP ${{ steps.version.outputs.tag }}"
          body: |
            ## SilphScope PvP ${{ steps.version.outputs.tag }} — Official Release (Countdown Move 1 Anchor, Dynamic Turn-Gated Makeup Energy, Overcharge Wrap-Around & Universal Fast-Move Registration)

            ### What's New in v3.69
            - **Move 1 First Dragon Breath Registration**:
              - Charge attack button empty-state detection now returns 0% baseline (instead of -1) during the "3, 2, 1, GO" pre-battle countdown.
              - Eliminates the missed first Dragon Breath (Move 1) by establishing an accurate 0% baseline so the first 4% direct energy / damage increase instantly registers.
            - **Overcharge 48E → 52E Wrap-Around Protection**:
              - Expanded icon-mask half-height (`0.0285h`) and outer flank sampling (16%..84%) prevents charge attack icon horns from causing false empty readings.
              - Meniscus detection prioritized ahead of outer ring clamps so wrap-around slices reliably register 52% energy instead of sticking at 100%.
            - **Turn-Gated Opponent Makeup Energy**:
              - Opponent optimal energy tracker loop is now gated strictly by turns instead of every single tick.
              - Makeup energy is only credited when opponent turns lag behind user confirmed turns by a full fast-move duration (`turnsBehind >= oppTurnDuration`).
            - **Pre-Battle HP Flicker Protection**:
              - Explicit `hasBattleStarted` flag prevents any energy or turn credits before battle start.
              - Filters transient HP flickers `< (fastMoveDamage / 2)` and requires `(2 + fastMoveTurns)` consecutive frames of decreased HP before confirming damage drops.
            - **Universal Fast-Move Turn Registration & Phase Reset**:
              - Implements PvPoke fast move registration mechanics across all mismatched turn matchups.
              - Incomplete moves cut off by charge attack priority freeze award 0 energy and 0 damage; full turn-0 phase reset occurs on charged attacks and switches.

            ### Live Web Simulator & Download
            - **Live Web Simulator**: [https://sportsfan986.github.io/silphscope-pvp/](https://sportsfan986.github.io/silphscope-pvp/)
            - **Android APK**: Download **`silphscope-pvp-${{ steps.version.outputs.tag }}.apk`** from the **Assets** section below and install on your Android device.
          files: |
            app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Release Asset Uploaded (Fallback)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK_FILE="app/build/outputs/apk/release/named/silphscope-pvp-${TAG}.apk"
          if [ -f "$APK_FILE" ]; then
            echo "Ensuring release asset is attached to $TAG via gh CLI..."
            gh release upload "$TAG" "$APK_FILE" --clobber || echo "Asset already up to date"
          fi


