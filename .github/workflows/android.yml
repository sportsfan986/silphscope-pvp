name: Build Android APK

concurrency:
  group: "android-build"
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

      workflow_version:
        description: 'Optional release version override (e.g. v1.01)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.workflow_version }}" ]; then
            RAW_VER="${{ github.event.inputs.workflow_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VER="v1.00"
          fi
          CLEAN_NUM="${RAW_VER#v}"
          TAG_NAME="v${CLEAN_NUM}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_num=${CLEAN_NUM}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${TAG_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore via keytool..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias gblkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gblrelease123 \
              -keypass gblrelease123 \
              -dname "CN=SilphScope PvP, OU=Android, O=SilphScope, C=US"
          else
            echo "Release keystore is present at app/release.keystore"
          fi

      - name: Build Release APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Named Release APK for Public Download
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk"

      - name: Build Debug APK
        if: github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-release-apk
          path: app/build/outputs/apk/release/named/silphscope-pvp-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always() && (github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both')
        with:
          name: silphscope-pvp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: create_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SilphScope PvP ${{ steps.version.outputs.tag }}"
          body: |
            ## SilphScope PvP ${{ steps.version.outputs.tag }} — Official Release (Turn-Scaled Debounce, 3T+ Sliver Latch, Adaptive Damage Filtering & Low-Damage Move Energy Multi-Credit)

            ### What's New in v3.66
            - **Adaptive Fast-Move Damage Filter & 50% Threshold**:
              - For 3T+ heavy fast moves, enforces a minimum damage threshold of >= 50% expected fast move damage (min 2%) to filter out transient 1-2% post-swap/charge attack glitches.
              - Prevents 3T fast moves from advancing an extra move ahead after swapping and throwing a charged attack.
            - **Direct Damage Detection for 1-Turn & 2-Turn Fast Moves**:
              - 1-turn and 2-turn fast moves bypass pending sliver latching (which do not render visibly in Pokémon GO) and rely strictly on confirmed direct damage drops.
              - Pending sliver latch-and-lock is exclusively reserved for 3-turn, 4-turn, and 5-turn fast moves.
            - **Turn-Scaled HP Debounce (+100ms per turn count)**:
              - Scaled confirmation debounce frames smoothly per turn count: 1T = 2 scans (200ms), 2T = 3 scans (300ms), 3T = 4 scans (400ms), 4T = 5 scans (500ms), 5T = 6 scans (600ms).
            - **Low-Damage Move Multi-Move Credit & Expanded Charged Move Reconciliation**:
              - Low-damage moves (<= 3.5% damage per move or 1T/2T) accept 1% drops and dynamically credit multiple moves when a multi-percent drop represents multiple elapsed turns (`min(dmgDerivedMoves, elapsedDerivedMoves)`), preventing low-damage moves from under-counting energy.
              - Pre-charged attack reconciliation window allows up to +3 moves of catchup during the ~10s stable pause.

            ### Live Web Simulator & Download
            - **Live Web Simulator**: [https://sportsfan986.github.io/silphscope-pvp/](https://sportsfan986.github.io/silphscope-pvp/)
            - **Android APK**: Download **`silphscope-pvp-${{ steps.version.outputs.tag }}.apk`** from the **Assets** section below and install on your Android device.
          files: |
            app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Release Asset Uploaded (Fallback)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK_FILE="app/build/outputs/apk/release/named/silphscope-pvp-${TAG}.apk"
          if [ -f "$APK_FILE" ]; then
            echo "Ensuring release asset is attached to $TAG via gh CLI..."
            gh release upload "$TAG" "$APK_FILE" --clobber || echo "Asset already up to date"
          fi


