name: Build Android APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

      workflow_version:
        description: 'Optional release version override (e.g. v1.01)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.workflow_version }}" ]; then
            RAW_VER="${{ github.event.inputs.workflow_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VER="v1.00"
          fi
          CLEAN_NUM="${RAW_VER#v}"
          TAG_NAME="v${CLEAN_NUM}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_num=${CLEAN_NUM}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${TAG_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore via keytool..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias gblkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gblrelease123 \
              -keypass gblrelease123 \
              -dname "CN=SilphScope PvP, OU=Android, O=SilphScope, C=US"
          else
            echo "Release keystore is present at app/release.keystore"
          fi

      - name: Build Release APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Named Release APK for Public Download
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk"

      - name: Build Debug APK
        if: github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-release-apk
          path: app/build/outputs/apk/release/named/silphscope-pvp-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always() && (github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both')
        with:
          name: silphscope-pvp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SilphScope PvP ${{ steps.version.outputs.tag }}"
          body: |
            ## SilphScope PvP ${{ steps.version.outputs.tag }} — Official v3.40 Release (Floating HP Bar Tracking, Persistent Bench HP Memory, Charged Attack Detection & Live Shield Callouts)
            
            ### What's New in v3.40
            - **Real-Time Floating HP Bar Tracking (Height-Invariant 2D Capsule Scanner)**:
              - Tracks both the Opponent's and Player's floating HP bars (`0–100%`) across variable Pokémon heights and head-bobbing animations using horizontal capsule scanline invariants (`W_fill + W_depleted ≈ 12.8%w`, `6–16px` thickness, white border check, and camera-cut freeze).
            - **Persistent Per-Slot HP Memory Across All Non-Fainted Pokémon (`userSlotHpPct[0..2]` & `oppSlotHpPct[0..2]`)**:
              - Remembers every Pokémon's remaining HP% when it swaps to the bench and displays per-slot HP bars and `%` readouts in the 3x3 matrix headers.
              - Scales all active and bench matchup Battle Ratings by `ln(userSlotHpPct[i] / oppSlotHpPct[j])` so future swaps, post-faint picks, and endgame recommendations account for chipped bench Pokémon on both teams.
              - Highlights Charged Move cells with a glowing **`KO`** badge whenever a move's damage % is sufficient to knock out the target's remaining HP%.
            - **Bidirectional Charged Attack Detection & Conservative Unshielded Move Attribution**:
              - Detects Charged Attacks thrown by both the Opponent (`"Attack incoming! Use a Protect Shield?"` / `"NOT NOW"`) and the Player (bottom move button disappearance during the swipe minigame).
              - Logs `CHARGED_ATTACK` timeline events (`actor`, `shielded`, `hpBeforePct`, `hpAfterPct`, `hpDeltaPct`) and attributes a specific move name **only** when the attack goes unshielded and the observed `ΔHP%` drop unambiguously matches a single move (`±8%` error and `≥12%` separation).
            - **Instant `"Attack Incoming!"` Shield vs. No-Shield Callout**:
              - Immediately displays an urgent **`[SHIELD CALL]`** recommendation (`SHIELD (1S)` vs. `NO SHIELD (TANK IT)`) when `"Attack incoming! Use a Protect Shield?"` appears, evaluating lethal vs. bait move damage against your current HP% and bench health.
            
            ### Live Web Simulator & Download
            - **Live Web Simulator**: [https://sportsfan986.github.io/silphscope-pvp/](https://sportsfan986.github.io/silphscope-pvp/)
            - **Android APK**: Download **`silphscope-pvp-${{ steps.version.outputs.tag }}.apk`** from the **Assets** section below and install on your Android device.
          files: |
            app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

