name = "silphscope-telemetry"
account_id = "5bcfb66e40f658fd522a594e378e3ef9"
main = "worker.mjs"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "TELEMETRY_KV"
id = "e50fe893fefe428b871c9b667ac3edc2"

# Dedicated Cloudflare R2 Bucket for User DVR Replay Vault & Web Share Player (10 GB/mo free, $0 egress):
[[r2_buckets]]
binding = "REPLAY_BUCKET"
bucket_name = "silphscope-replays"

[vars]
WORKER_VERSION = "7.0.6"
TELEGRAM_NOTIFY_TELEMETRY_BATCHES = "false"
TELEGRAM_NOTIFY_ONLY_MANUAL_DVR = "true"
GLOBAL_MAX_R2_STORAGE_GB = "9.0"

# Secrets configured via `npx wrangler secret put <NAME>`:
# - CLIENT_INGEST_KEY     (Shared key sent by the SilphScope Android app in `X-SilphScope-Client-Key`)
# - ADMIN_API_KEY         (Secret key used by your PC's `scripts/ingest-telemetry.mjs` in `Authorization: Bearer ...`)
# - TELEGRAM_BOT_TOKEN    (Bot token from @BotFather, e.g. `123456789:ABCdef...`)
# - TELEGRAM_CHAT_ID      (Target Telegram Channel or Group ID, e.g. `-1001234567890`)
