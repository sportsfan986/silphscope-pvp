name = "silphscope-telemetry"
account_id = "5bcfb66e40f658fd522a594e378e3ef9"
main = "worker.mjs"
compatibility_date = "2024-11-01"
workers_dev = true

routes = [
  { pattern = "silphscopepvp.com", custom_domain = true },
  { pattern = "www.silphscopepvp.com", custom_domain = true },
  { pattern = "api.silphscopepvp.com", custom_domain = true },
  { pattern = "dvr.silphscopepvp.com", custom_domain = true },
  { pattern = "dl.silphscopepvp.com", custom_domain = true }
]

[[kv_namespaces]]
binding = "TELEMETRY_KV"
id = "e50fe893fefe428b871c9b667ac3edc2"

# Dedicated Cloudflare R2 Bucket for User DVR Replay Vault & Web Share Player (10 GB/mo free, $0 egress):
[[r2_buckets]]
binding = "REPLAY_BUCKET"
bucket_name = "silphscope-replays"

# Dedicated Cloudflare D1 Serverless SQLite Database for Multi-Device Battle Logs, Teams, Settings & Global Meta (5 GB free, 5M reads/day, 100k writes/day):
[[d1_databases]]
binding = "SYNC_DB"
database_name = "silphscope-sync-db"
database_id = "6588eb30-92b3-41d8-bc42-107b7ccfa305"

[vars]
WORKER_VERSION = "7.3.5"
TELEGRAM_NOTIFY_TELEMETRY_BATCHES = "false"
TELEGRAM_NOTIFY_ONLY_MANUAL_DVR = "true"
GLOBAL_MAX_R2_STORAGE_GB = "9.0"

# Secrets configured via `npx wrangler secret put <NAME>`:
# - CLIENT_INGEST_KEY     (Shared key sent by the SilphScope Android app in `X-SilphScope-Client-Key`)
# - ADMIN_API_KEY         (Secret key used by your PC's `scripts/ingest-telemetry.mjs` in `Authorization: Bearer ...`)
# - STRIPE_WEBHOOK_SECRET (Signing secret `whsec_...` from Stripe Dashboard for `/v1/webhooks/stripe`)
# - BMC_WEBHOOK_SECRET    (Webhook secret from Buy Me a Coffee for `/v1/webhooks/bmc`)
# - SESSION_HMAC_KEY      (Optional dedicated secret for signing vault session tokens; defaults to domain-separated ADMIN_API_KEY)
# - LICENSE_HMAC_KEY      (Optional dedicated secret for signing offline license payloads; defaults to domain-separated ADMIN_API_KEY)
# - PASSWORD_PEPPER       (Optional dedicated secret pepper for PBKDF2 password hashes; defaults to domain-separated ADMIN_API_KEY)
# - TELEGRAM_BOT_TOKEN    (Bot token from @BotFather, e.g. `123456789:ABCdef...`)
# - TELEGRAM_CHAT_ID      (Target Telegram Channel or Group ID, e.g. `-1001234567890`)
